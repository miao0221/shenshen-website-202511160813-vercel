<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周深粉丝网站</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">周深粉丝网站</h1>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#/" class="nav-link" data-route="/">首页</a>
                </li>
                <li class="nav-item">
                    <a href="#/music" class="nav-link" data-route="/music">音乐</a>
                </li>
                <li class="nav-item">
                    <a href="#/video" class="nav-link" data-route="/video">视频</a>
                </li>
                <li class="nav-item">
                    <a href="#/admin" class="nav-link" data-route="/admin" id="admin-link">管理员中心</a>
                </li>
                <!-- 认证相关链接 -->
                <li class="nav-item" id="auth-links">
                    <a href="#/auth" class="nav-link" data-route="/auth" id="auth-link">登录/注册</a>
                </li>
                <li class="nav-item" id="user-links" style="display: none;">
                    <a href="#/profile" class="nav-link" data-route="/profile" id="profile-link">个人中心</a>
                    <span class="welcome-text" id="welcome-text"></span>
                    <button class="btn btn-secondary" id="logout-btn" style="margin-left: 10px;">退出登录</button>
                </li>
            </ul>
        </div>
    </nav>

    <main id="app">
        <!-- 页面内容将在这里动态加载 -->
    </main>

    <script>
        // 初始化Supabase客户端
        const SUPABASE_URL = 'https://ywzqkjparfslwwvjuwlx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3enFranBhcmZzbHd3dmp1d2x4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMyMjI0ODYsImV4cCI6MjA3ODc5ODQ4Nn0.2fKie0CH12aoxvnUAO2IPrdZ1NtkyK8ujErx7FTiDxY';
        window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // 检查用户登录状态并更新导航栏
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data: { session } } = await window.supabaseClient.auth.getSession();
                updateAuthUI(session);
            } catch (error) {
                console.error('检查用户登录状态时出错:', error);
            }
        });
        
        // 更新认证UI
        async function updateAuthUI(session) {
            const authLinks = document.getElementById('auth-links');
            const userLinks = document.getElementById('user-links');
            const welcomeText = document.getElementById('welcome-text');
            const logoutBtn = document.getElementById('logout-btn');
            
            if (session) {
                // 用户已登录
                try {
                    const { data: { user } } = await window.supabaseClient.auth.getUser();
                    const userEmail = user?.email || '用户';
                    
                    // 隐藏登录/注册链接
                    if (authLinks) {
                        authLinks.style.display = 'none';
                    }
                    
                    // 显示个人中心链接、欢迎信息和退出按钮
                    if (userLinks && welcomeText) {
                        welcomeText.textContent = `欢迎, ${userEmail}`;
                        userLinks.style.display = 'flex';
                        userLinks.style.alignItems = 'center';
                    }
                    
                    // 设置退出按钮事件
                    if (logoutBtn) {
                        logoutBtn.onclick = handleLogout;
                    }
                } catch (error) {
                    console.error('获取用户信息时出错:', error);
                }
            } else {
                // 用户未登录
                // 显示登录/注册链接
                if (authLinks) {
                    authLinks.style.display = 'list-item';
                }
                
                // 隐藏个人中心链接、欢迎信息和退出按钮
                if (userLinks) {
                    userLinks.style.display = 'none';
                }
            }
        }
        
        // 处理退出登录
        async function handleLogout() {
            try {
                await window.supabaseClient.auth.signOut();
                updateAuthUI(null);
                window.location.hash = '#/';
                window.location.reload();
            } catch (error) {
                console.error('登出失败:', error);
            }
        }
    </script>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
