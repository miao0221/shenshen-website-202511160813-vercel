<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深的N次方</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
    <!-- 网站标题 -->
    <div class="site-title">
        <h1>深的N次方</h1>
    </div>
    
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#/" class="nav-link" data-route="/">首页</a>
                </li>
                <li class="nav-item">
                    <a href="#/music" class="nav-link" data-route="/music">音乐</a>
                </li>
                <li class="nav-item">
                    <a href="#/video" class="nav-link" data-route="/video">视频</a>
                </li>
                <li class="nav-item">
                    <a href="#/time-capsule" class="nav-link" data-route="/time-capsule">时间胶囊</a>
                </li>
                <li class="nav-item">
                    <a href="#/honor-wall" class="nav-link" data-route="/honor-wall">荣誉墙</a>
                </li>
                <li class="nav-item">
                    <a href="#/merchandise" class="nav-link" data-route="/merchandise">商务与周边</a>
                </li>
                <li class="nav-item">
                    <a href="#/interviews" class="nav-link" data-route="/interviews">采访</a>
                </li>
                <li class="nav-item">
                    <a href="#/fans" class="nav-link" data-route="/fans">生米广场</a>
                </li>
            </ul>
        </div>
    </nav>
    
    <!-- 用户认证区域 -->
    <div class="user-auth-area">
        <div id="auth-links">
            <a href="#/auth" class="nav-link" data-route="/auth" id="auth-link">登录/注册</a>
        </div>
        <div class="user-dropdown" id="user-dropdown" style="display: none;">
            <div class="dropdown-header">
                <span class="welcome-text" id="welcome-text"></span>
                <span class="dropdown-arrow">▼</span>
            </div>
            <div class="dropdown-menu" id="dropdown-menu">
                <a href="#/profile" class="nav-link" data-route="/profile">个人中心</a>
                <!-- 管理员中心链接，默认隐藏 -->
                <a href="#/admin" class="nav-link" data-route="/admin" id="admin-link" style="display: none;">管理员中心</a>
                <button class="btn btn-secondary" id="logout-btn">退出登录</button>
            </div>
        </div>
    </div>

    <main id="app">
        <!-- 页面内容将在这里动态加载 -->
    </main>

    <script>
        // 初始化Supabase客户端
        const SUPABASE_URL = 'https://ywzqkjparfslwwvjuwlx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3enFranBhcmZzbHd3dmp1d2x4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMyMjI0ODYsImV4cCI6MjA3ODc5ODQ4Nn0.2fKie0CH12aoxvnUAO2IPrdZ1NtkyK8ujErx7FTiDxY';
        window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // 检查用户登录状态并更新导航栏
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data: { session } } = await window.supabaseClient.auth.getSession();
                updateAuthUI(session);
            } catch (error) {
                console.error('检查用户登录状态时出错:', error);
            }
            
            // 添加下拉菜单事件监听器
            const dropdownHeader = document.querySelector('.dropdown-header');
            const dropdownMenu = document.getElementById('dropdown-menu');
            
            if (dropdownHeader && dropdownMenu) {
                dropdownHeader.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdownMenu.classList.toggle('show');
                });
                
                // 点击页面其他地方隐藏下拉菜单
                document.addEventListener('click', (e) => {
                    if (!dropdownHeader.contains(e.target)) {
                        dropdownMenu.classList.remove('show');
                    }
                });
            }
        });
        
        // 更新认证UI
        async function updateAuthUI(session) {
            const authLinks = document.getElementById('auth-links');
            const userDropdown = document.getElementById('user-dropdown');
            const welcomeText = document.getElementById('welcome-text');
            const logoutBtn = document.getElementById('logout-btn');
            const adminLink = document.getElementById('admin-link');
            
            if (session) {
                // 用户已登录
                try {
                    const { data: { user } } = await window.supabaseClient.auth.getUser();
                    const userEmail = user?.email || '用户';
                    
                    // 获取用户昵称
                    let userNickname = '';
                    try {
                        const { data: profile, error } = await window.supabaseClient
                            .from('user_profiles')
                            .select('nickname')
                            .eq('id', user.id)
                            .single();
                        
                        if (error && error.code !== 'PGRST116') { // PGRST116表示未找到记录
                            console.error('获取用户资料时出错:', error);
                        }
                        
                        userNickname = profile?.nickname || '';
                    } catch (error) {
                        console.error('获取用户资料时出错:', error);
                    }
                    
                    // 隐藏登录/注册链接
                    if (authLinks) {
                        authLinks.style.display = 'none';
                    }
                    
                    // 显示用户下拉菜单和欢迎信息
                    if (userDropdown && welcomeText) {
                        const displayName = userNickname || userEmail;
                        welcomeText.textContent = `欢迎 ${displayName}`;
                        userDropdown.style.display = 'block';
                    }
                    
                    // 检查是否为管理员并显示管理员中心链接
                    if (adminLink) {
                        const isAdmin = await checkIfAdmin(userEmail);
                        adminLink.style.display = isAdmin ? 'block' : 'none';
                    }
                    
                    // 设置退出按钮事件
                    if (logoutBtn) {
                        logoutBtn.onclick = handleLogout;
                    }
                } catch (error) {
                    console.error('获取用户信息时出错:', error);
                }
            } else {
                // 用户未登录
                // 显示登录/注册链接
                if (authLinks) {
                    authLinks.style.display = 'block';
                }
                
                // 隐藏用户下拉菜单
                if (userDropdown) {
                    userDropdown.style.display = 'none';
                }
                
                // 隐藏管理员中心链接
                if (adminLink) {
                    adminLink.style.display = 'none';
                }
            }
        }
        
        // 检查用户是否为管理员
        async function checkIfAdmin(email) {
            try {
                const { data, error } = await window.supabaseClient
                    .from('admins')
                    .select('id')
                    .eq('email', email)
                    .single();
                
                if (error && error.code !== 'PGRST116') { // PGRST116表示未找到记录
                    console.error('检查管理员权限时出错:', error);
                    return false;
                }
                
                return !!data;
            } catch (error) {
                console.error('检查管理员权限时出错:', error);
                return false;
            }
        }
        
        // 处理退出登录
        async function handleLogout() {
            try {
                await window.supabaseClient.auth.signOut();
                updateAuthUI(null);
                window.location.hash = '#/';
                window.location.reload();
            } catch (error) {
                console.error('登出失败:', error);
            }
        }
    </script>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
